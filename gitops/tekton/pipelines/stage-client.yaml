apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: stage-client
spec:
  params:
    - name: git-url
      type: string
      description: the url of the config repo to clone
      default: 'https://github.com/rh-ee-tkiss/grumpycat-config.git'
    - name: git-revision
      type: string
      description: the revision of the config repo to clone
      default: main
    - name: target-image
      type: string
      description: The target image name of the config (without tag/digest)
      default: quay.io/rh-ee-tkiss/grumpycat-melonjs

    - name: kustomize-dev
      type: string
      description: Kustomize target dev
      default: config/overlays/dev
    - name: kustomize-stage
      type: string
      description: kustomize target stage
      default: config/overlays/stage
    - name: release-name
      type: string
      description: Release name will be used as image tag in quay.io and feature branch in Git
  tasks:
    - name: git-clone
      params:
        - name: URL
          value: $(params.git-url)
        - name: DELETE_EXISTING
          value: 'true'
        - name: VERBOSE
          value: 'true'
        - name: REVISION
          value: $(params.git-revision)
        - name: SUBDIRECTORY
          value: the-config
      taskRef:
        resolver: cluster
        params:
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: output
          workspace: shared-workspace   
    - name: git-branch
      params:
        - name: GIT_SCRIPT
          value: cd the-config && git checkout -b release-$(params.release-name)
      runAfter:
        - git-clone
      taskRef:
        resolver: cluster
        params:
          - name: name
            value: git-cli
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: input
          workspace: shared-workspace
    - name: extract-digest
      params:
        - name: kustomize-dir
          value: the-config/$(params.kustomize-dev)
        - name: image-name
          value: $(params.target-image)
      runAfter:
        - git-branch
      taskRef:
        kind: Task
        name: extract-kustomize-digest
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: tag-image
      params:
        - name: SOURCE_IMAGE_URL
          value: >-
            docker://$(params.target-image)@$(tasks.extract-digest.results.DIGEST)
        - name: DESTINATION_IMAGE_URL
          value: >-
            docker://$(params.target-image):$(params.release-name)
      runAfter:
        - extract-digest
      taskRef:
        resolver: cluster
        params:
          - name: name
            value: skopeo-copy
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: images_url
          workspace: shared-workspace

    - name: update-release
      params:
        - name: kustomize-dir
          value: $(params.kustomize-stage)
        - name: release-name
          value: "$(params.release-name)"
        - name: old-image
          value: "$(params.target-image):latest"
        - name: new-image
          value: "$(params.target-image)"
        - name: digest
          value: "$(tasks.extract-digest.results.DIGEST)"
      runAfter:
        - tag-image
      taskRef:
        kind: Task
        name: create-release
      workspaces:
        - name: workspace
          workspace: shared-workspace        

  workspaces:
    - name: shared-workspace
      optional: false
